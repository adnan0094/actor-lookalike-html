<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النتائج - ممثل شبيه</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <span class="logo-icon">📷</span>
                    <span class="logo-text">ممثل شبيه</span>
                </div>
                <button class="language-toggle" id="langToggle">
                    <span class="globe-icon">🌐</span>
                    <span id="langText">EN</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Results Container -->
    <div class="results-container">
        <div class="container">
            <!-- Back Button -->
            <button class="back-btn" onclick="navigateTo('index')">
                <span class="arrow">→</span>
                <span id="backText">العودة للرئيسية</span>
            </button>

            <!-- Results Header -->
            <div class="results-header">
                <h1 id="resultsTitle">🎬 وجدنا تطابقك!</h1>
                <p id="resultsSubtitle">أنت تشبه الممثل <span id="actorNameDisplay"></span> بنسبة <span id="scoreDisplay">0</span>%</p>
            </div>

            <!-- Results Card -->
            <div class="results-card">
                <!-- Comparison Section -->
                <div class="comparison-section">
                    <!-- User Image -->
                    <div class="comparison-item">
                        <div class="comparison-image-wrapper">
                            <img id="userImage" alt="صورتك" class="comparison-image">
                        </div>
                        <p id="yourPhotoText">صورتك</p>
                    </div>

                    <!-- VS -->
                    <div class="vs-section">
                        <div class="vs-text">VS</div>
                        <div class="score-display">
                            <div class="score-number" id="scoreNumber">0%</div>
                            <p id="matchText">نسبة التطابق</p>
                        </div>
                    </div>

                    <!-- Actor Image -->
                    <div class="comparison-item">
                        <div class="comparison-image-wrapper">
                            <img id="actorImage" alt="الممثل" class="comparison-image">
                        </div>
                        <p id="actorDisplayName"></p>
                    </div>
                </div>

                <!-- Actor Info -->
                <div class="actor-info">
                    <h2 id="actorInfoName"></h2>
                    <div class="actor-rating">
                        <span class="star">⭐</span>
                        <span id="actorTypeText">ممثل سوري مشهور</span>
                    </div>
                    <p id="actorBioText">من أشهر الممثلين السوريين الذين قدموا أدواراً متميزة في الدراما السورية والعربية. يتمتع بموهبة فنية عالية وحضور قوي على الشاشة.</p>
                </div>

                <!-- Actions -->
                <div class="results-actions">
                    <button class="btn btn-primary" onclick="shareResult()" id="shareBtnText">
                        <span class="btn-icon">📤</span>
                        شارك النتيجة
                    </button>
                    <button class="btn btn-outline" onclick="navigateTo('upload')" id="tryAgainText">
                        <span class="btn-icon">→</span>
                        حاول مرة أخرى
                    </button>
                </div>
            </div>

            <!-- History Link -->
            <div class="history-link">
                <button class="btn btn-ghost" onclick="navigateTo('history')" id="historyBtnText">
                    <span class="btn-icon">📋</span>
                    عرض سجل المقارنات السابقة
                </button>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/app.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
